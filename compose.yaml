services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iot -d iot']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
